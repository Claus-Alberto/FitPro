<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitPro — Conectando com a Alexa…</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #F9FAFB; color: #191511;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 360px; }
  h1 { font-size: 18px; font-weight: 800; margin: 16px 0 8px; }
  p { font-size: 14px; color: #6B7280; margin: 0 0 20px; }
  a {
    display: inline-block; text-decoration: none; color: #FFF; font-weight: 700;
    background: #008E00; border-radius: 14px; padding: 14px 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Conectando com a Alexa…</h1>
    <p id="msg">Redirecionando de volta para o FitPro.</p>
    <a id="manual" href="#" style="display:none;">Abrir o FitPro</a>
  </div>

  <script>
    /**
     * Esta página existe só porque a Amazon (Login with Amazon) exige que a "Allowed Return URL"
     * seja https://, mas o FitPro é um app nativo sem servidor próprio, que só sabe responder a
     * um deep link customizado (fitpro://alexa-callback). Esta ponte pega os parâmetros que a
     * Amazon devolveu na query string (code, state, error, etc.) e repassa pro app via redirect
     * para o esquema customizado.
     */
    const params = window.location.search + window.location.hash.replace('#', '&');
    const target = 'fitpro://alexa-callback' + (params ? '?' + params.replace(/^[?&]/, '') : '');
    document.getElementById('manual').href = target;
    window.location.replace(target);
    setTimeout(function () {
      document.getElementById('msg').textContent = 'Se o app não abrir automaticamente, toque no botão abaixo.';
      document.getElementById('manual').style.display = 'inline-block';
    }, 1500);
  </script>
</body>
</html>
