<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Política de Privacidade — FitPro</title>
<style>
  :root {
    color-scheme: light;
  }
  body {
    margin: 0;
    padding: 0;
    background: #F9FAFB;
    color: #191511;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }
  header {
    margin-bottom: 32px;
  }
  .brand {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #008E00;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 8px;
  }
  .updated {
    font-size: 13px;
    color: #6B7280;
  }
  .card {
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 20px;
    padding: 32px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 800;
    color: #191511;
    margin: 28px 0 8px;
  }
  .section-title:first-child {
    margin-top: 0;
  }
  p {
    font-size: 15px;
    color: #374151;
    margin: 0 0 4px;
    white-space: pre-wrap;
  }
  footer {
    margin-top: 32px;
    font-size: 13px;
    color: #9CA3AF;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">FitPro</div>
      <h1>Política de Privacidade</h1>
      <div class="updated">Última atualização: 20 de agosto de 2026</div>
    </header>
    <div class="card" id="content"></div>
    <footer>FitPro — este documento também está disponível dentro do App, em Configurações → Privacidade.</footer>
  </div>

  <script>
    const raw = `1. VISÃO GERAL

Esta Política de Privacidade descreve como o FitPro trata os dados relacionados ao seu uso do App. Leia com atenção.

2. QUE DADOS EXISTEM E ONDE FICAM

O FitPro é local-first: dados como fichas de treino, séries e cargas registradas, refeições e alimentos, medidas corporais, fotos de progresso, preferências e configurações são armazenados no banco de dados local do seu próprio aparelho (SQLite), não em um servidor do desenvolvedor. O desenvolvedor não tem acesso remoto, por padrão, a esses dados.

3. CHAMADAS DE REDE REALIZADAS PELO APP

Para funcionalidades específicas, o App pode fazer chamadas de rede a serviços públicos de terceiros, como: (a) consulta de produtos por código de barras a uma base pública de alimentos, ao escanear um item na aba de Dieta; (b) carregamento de imagens de demonstração de exercícios a partir de um repositório público de mídia, ao visualizar informações de um exercício. Essas chamadas são feitas para obter dado público (não enviam seus dados pessoais de treino/dieta/perfil a esses serviços) e podem estar sujeitas às políticas de privacidade dos respectivos terceiros.

4. INTEGRAÇÕES OPCIONAIS QUE VOCÊ ATIVA

Funcionalidades opcionais que exigem conectar sua conta com um serviço de terceiro (por exemplo, sincronização de lista de compras) só são ativadas mediante sua autorização explícita, e nesse caso dados relevantes à funcionalidade (como itens de uma lista) podem ser trocados com esse terceiro conforme necessário para a integração funcionar. Você pode desconectar essas integrações a qualquer momento nas configurações do App.

5. USO DOS DADOS

Na extensão em que qualquer dado venha a ser processado, coletado ou transmitido pelo App agora ou em versões futuras (incluindo, sem limitação, em decorrência de funcionalidades de nuvem, sincronização, backup remoto, analytics, ou integrações que venham a ser adicionadas), o desenvolvedor se reserva o direito de usar, processar, armazenar, agregar, anonimizar e analisar tais dados para operar, manter, proteger, melhorar e desenvolver o App e seus serviços, incluindo para fins estatísticos, de pesquisa, de comunicação com o usuário e de cumprimento de obrigações legais, na maior extensão permitida pela legislação aplicável, incluindo a Lei Geral de Proteção de Dados (Lei 13.709/2018).

6. COMPARTILHAMENTO

O desenvolvedor não vende dados pessoais a terceiros. Dados podem ser compartilhados: (a) com prestadores de serviço que auxiliem na operação do App, sob obrigações de confidencialidade; (b) quando exigido por lei, ordem judicial ou autoridade competente; (c) em caso de reorganização societária, fusão, aquisição ou venda de ativos do desenvolvedor, como parte dos ativos transferidos; (d) com serviços de terceiros que você mesmo optar por conectar, conforme cláusula 4.

7. SEUS DIREITOS

Como titular de dados, você pode, a qualquer momento: (a) apagar todos os dados locais do App usando a opção "Resetar Dados Locais" disponível no menu de perfil, o que remove permanentemente as informações armazenadas no seu aparelho; (b) desinstalar o App, o que também remove os dados locais associados a ele; (c) desconectar qualquer integração opcional ativada. Para outras solicitações relacionadas aos seus dados, utilize os canais de contato indicados no App.

8. SEGURANÇA

Adotamos medidas técnicas razoáveis para proteger os dados tratados pelo App, mas nenhum sistema é totalmente livre de riscos. Como os dados principais ficam armazenados localmente, a segurança física e de acesso ao seu próprio aparelho também é sua responsabilidade.

9. MENORES DE IDADE

O App não é direcionado a menores de 13 anos. Se você tem entre 13 e 18 anos, o uso do App deve ser supervisionado por um responsável legal.

10. ALTERAÇÕES DESTA POLÍTICA

Esta Política pode ser atualizada periodicamente. A data no topo deste documento indica a versão mais recente. Alterações relevantes serão comunicadas, quando aplicável, dentro do próprio App.

11. CONTATO

Dúvidas sobre esta Política podem ser direcionadas pelos canais de suporte indicados dentro do próprio App.`;

    const container = document.getElementById('content');
    const blocks = raw.split(/\n\n+/);
    const headerRegex = /^\d+\.\s+[A-ZÀ-Ú\s]+$/;
    for (const block of blocks) {
      const el = document.createElement(headerRegex.test(block.trim()) ? 'div' : 'p');
      if (headerRegex.test(block.trim())) el.className = 'section-title';
      el.textContent = block.trim();
      container.appendChild(el);
    }
  </script>
</body>
</html>
